# INOMO: builds the v17-dev Pegasus image from pegasus/ and deploys it to erp-dev.
name: pegasus

on:
  push:
    branches: [pegasus-develop]
    paths-ignore: [pegasus/deploy/**, "**.md"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      # The bench build needs more than the runner's free disk.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force
          df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: pegasus
          file: pegasus/Containerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}:develop-${{ github.sha }}
          # Links the package to this public repo, so it is public too.
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Deploy the new tag to erp-dev
        run: |
          cd pegasus/deploy/erp-dev
          kustomize edit set image "ghcr.io/${{ github.repository }}=ghcr.io/${{ github.repository }}:develop-${{ github.sha }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: deploy ${GITHUB_SHA::7} to erp-dev"
          git push
